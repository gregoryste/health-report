# n8n do protótipo (orquestrador, D3). Subir de dentro de prototipo/n8n/:
#   docker compose --env-file ../.env up -d
# Só a chave da API do serviço entra no container (nada de token da LLM nem dado de paciente).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - SERVICO_URL=http://host.docker.internal:8000
      - SERVICO_API_KEY=${SERVICO_API_KEY}
    volumes:
      - n8n_dados:/home/node/.n8n
      - ./fluxos:/fluxos:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  n8n_dados:
